# Co godzinę pobiera listę filmów z kanału YouTube do dane/filmy.json
# i zapisuje zmiany w repozytorium. Strona (np. na GitHub Pages) czyta ten plik,
# więc nowe odcinki i shorty pojawiają się same.
name: Aktualizuj filmy z YouTube
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  filmy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 narzedzia/aktualizuj_filmy.py
      - name: Zapisz zmiany, jeśli są
        run: |
          if git diff --quiet -- dane/filmy.json; then echo "bez zmian"; exit 0; fi
          git config user.name "chmuroholik-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dane/filmy.json
          git commit -m "Aktualizacja listy filmów z YouTube"
          git push
